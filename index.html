<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library</title>
    <link rel="icon" type="image/x-icon" href="favicontal.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atomic+Age&family=Quicksand:wght@300..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo-area">
          My Library Books
        </div>
    </header>

    <div class="cards-grid" id="cardsContainer"></div>

    <div class="form-wrapper" id="formWrapper">
        <div class="form-container">
            <form id="cardForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input required type="text" id="title" placeholder="e.g., The Odyssey">
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" required placeholder="e.g., Homer">
                    </div>
                    <div class="form-group">
                        <label for="date">Date of Publication</label>
                        <input type="number" id="date" required placeholder="e.g., 800">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="type">Type (Badge)</label>
                        <select id="type" required>
                            <option value="Poem">Poem</option>
                            <option value="Myth/Legend">Myth/Legend</option>
                            <option value="Scripture">Scripture</option>
                            <option value="Novel">Novel</option>
                            <option value="Epic">Epic</option>
                            <option value="Play">Play</option>
                            <option value="Philosophy">Philosophy</option>
                            <option value="History">History</option>
                            <option value="Biography">Biography</option>
                            <option value="Folklore">Folklore</option>
                            <option value="Fable">Fable</option>
                            <option value="Short Story">Short Story</option>
                            <option value="Essay">Essay</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Romance">Romance</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Horror">Horror</option>
                            <option value="Drama">Drama</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Tragedy">Tragedy</option>
                            <option value="Memoir">Memoir</option>
                            <option value="Satire">Satire</option>
                            <option value="Non-fiction">Non-fiction</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="totalPages">Total Pages</label>
                        <input type="number" id="totalPages" min="1" placeholder="e.g., 300">
                    </div>
                    <div class="form-group">
                        <label for="readPages">Read Pages</label>
                        <input type="number" id="readPages" min="0" placeholder="e.g., 150">
                        <span id="pagesError" class="error-message" style="display: none;">Read pages cannot exceed total pages.</span>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="available">
                        <label for="available">Available in Library</label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tags">Tags (Comma separated)</label>
                        <input type="text" id="tags" placeholder="e.g., Adventure, Heroism, Fate">
                    </div>
                    <div class="form-group">
                        <label for="quote">Best Quote</label>
                        <input type="text" id="quote" placeholder="e.g., 'Sing to me of the man, Muse...'">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="add-btn">Create Book</button>
            </form>
        </div>
    </div>

    <footer id="footer">Muayad Elamin</footer>
    <script src="script.js"></script>
</body>
</html>
